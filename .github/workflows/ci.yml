name: ci

on:
    pull_request:
        branches : [main]
jobs:
    tests:
        name : Tests
        runs-on: ubuntu-latest
        steps:
            - name : check out code 
              uses: actions/checkout@v6
            - name: check go lang code 
              uses: actions/setup-go@v6
            - name: fix the error # force failure
              run : go test -cover ./...
    Style:
      name : Style
      runs-on: ubuntu-latest
      steps:
            - name: Style
              run: test -z $(go fmt ./...)